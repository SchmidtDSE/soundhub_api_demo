name: soundhub
description: |
  Wildlife Soundhub API: powering an online platform for storing, analyzing and sharing bioacoustic data.
authors:
  - url: https://gif.berkeley.edu/
    email: bgaley@berkeley.edu 
  - url: https://dse.berkeley.edu/
    email: bguzder-williams@berkeley.edu 

remotes:
  - core

databases:
  - owl
  - birdnet
  - birdnet-bullfrog
  - birdnet-nutria
  - perch-bullfrog

# Non-remote endpoints (API Dock's own endpoints)
endpoints:
  - "/"                    # API metadata and information

# Global restrictions (applied to all remotes unless overridden)
restricted:
  - route: "*"
    method: delete 

# Additional Settings
settings:
    add_trailing_slash: false
    follow_redirects: false
    # DuckDB options for every database query (needs api_dock >= 0.8.2; older versions
    # ignore it). Sized for the 1 vCPU / 2 GB App Runner instance: at most 2 queries at
    # once x 600MB each, leaving room for Python. Over the limit DuckDB spills to disk
    # or fails that one query instead of the instance being OOM-killed.
    duckdb:
      memory_limit: 600MB
      threads: 2
      max_concurrent_queries: 2

# Expose Proxy Structure
expose:
  dict: false
  remotes: true
  databases: true
  sources: true