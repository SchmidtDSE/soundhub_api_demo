name: birdnet-Nutria
description: Nutria Classifier from Birdnet 2.4
authors:
  - API Team

tables:
  detections:
    uri: s3://dse-soundhub/artifacts/run-0eb5a647-a9c5-47f5-aaf8-81a89bc1f9d6/detections/54eceae61b2989d1b1d7d241cb0da2889b7e32e7f82c4830c567c0ea31ec8cff.parquet
    region: us-west-2
    public: true

routes:
  - route: /recordings/{{recording_id}}/detections/
    sql: SELECT [[detections]].* FROM [[detections]] WHERE [[detections]].recording_id = {{recording_id}}
    query_params:
      - confidence:
          sql: "[[detections]].confidence >= {{confidence}}"
      - scientific_name:
          sql: "UPPER([[detections]].scientific_name) = UPPER('{{scientific_name}}')"
      - common_name:
          sql: "UPPER([[detections]].common_name) = UPPER('{{common_name}}')"
      - rank:
          sql: "[[detections]].rank = {{rank}}"
      - start_time:
          sql: "[[detections]].start_time >= {{start_time}}"
      - end_time:
          sql: "[[detections]].end_time <= {{end_time}}"
  - route: /detections/{{id}}
    sql: SELECT [[detections]].* FROM [[detections]] WHERE [[detections]].id = {{id}}
  - route: detections/
    sql:
      - when: count
        then:
          sql: >
            SELECT detections.common_name, detections.scientific_name,
                   COUNT(DISTINCT detections.id) AS count
            FROM [[detections]]
          sql_append: GROUP BY detections.common_name, detections.scientific_name ORDER BY count DESC
      - else: SELECT [[detections]].id FROM [[detections]]
    query_params:
      - recording:
          sql: "[[detections]].recording_id = {{recording}}"
          multivalue_sql: "[[detections]].recording_id in {{recording}}"

query_params:
  - sort:
      sql_append: ORDER BY {{sort}} {{direction}}
  - direction:
      default: ASC
  - offset:
      sql_append: OFFSET {{offset}}
  - limit:
      sql_append: LIMIT {{limit}}








