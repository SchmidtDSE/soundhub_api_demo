name: birdnet
description: BirdNET v2.4 detection database - Version 0.1
authors:
  - API Team

tables:
  observations:
    uri: s3://dse-soundhub/artifacts/run-ee2e6559-d00a-4c27-a6ba-7baf97481fc4/observations/49d5c291983581c8efcdee92d7800d7d28c9be8213b45867a118626738450a77.parquet
    region: us-west-2
    public: true

routes:
  - route: /recordings/{{recording_id}}/observations/
    sql: SELECT [[observations]].* FROM [[observations]] WHERE [[observations]].recording_id = {{recording_id}}
    query_params:
      - confidence:
          sql: "[[observations]].confidence >= {{confidence}}"
      - scientific_name:
          sql: "UPPER([[observations]].scientific_name) = UPPER('{{scientific_name}}')"
      - common_name:
          sql: "UPPER([[observations]].common_name) = UPPER('{{common_name}}')"
      - rank:
          sql: "[[observations]].rank = {{rank}}"
      - start_time:
          sql: "[[observations]].start_time >= {{start_time}}"
      - end_time:
          sql: "[[observations]].end_time <= {{end_time}}"
  - route: observations/{{id}}
    sql: SELECT [[observations]].* FROM [[observations]] WHERE [[observations]].id = {{id}}
  - route: observations/
    sql:
      - when: count
        then:
          sql: >
            SELECT [[observations]].common_name, [[observations]].scientific_name,
                   COUNT(*) AS count
            FROM [[observations]]
          sql_append: GROUP BY [[observations]].common_name, [[observations]].scientific_name
      - else: SELECT [[observations]].id FROM [[observations]]
    query_params:
      - recording:
          sql: "[[observations]].recording_id = {{recording}}"
          multivalue_sql: "[[observations]].recording_id in {{recording}}"

query_params:
  - sort:
      sql_append: ORDER BY {{sort}} {{direction}}
  - direction:
      default: ASC
  - offset:
      sql_append: OFFSET {{offset}}
  - limit:
      sql_append: LIMIT {{limit}}