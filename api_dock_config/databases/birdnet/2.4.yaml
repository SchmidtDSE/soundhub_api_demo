name: birdnet
description: BirdNET v2.4 detection database - Version 0.1
authors:
  - API Team

schema: birdnet_2p4

# Overrides the shared detections/ route: the count query also joins revisions.
routes:
  - route: detections/
    sql:
      - when: count
        then:
          sql: >
            SELECT detections.common_name, detections.scientific_name,
                   COUNT(DISTINCT detections.id) AS count,
                   COUNT(revisions.id) AS revcount
            FROM [[detections]]
            LEFT JOIN [[revisions]] ON revisions.observation_id = detections.id
          sql_append: GROUP BY detections.common_name, detections.scientific_name ORDER BY count DESC
      - else: SELECT [[detections]].* FROM [[detections]]
    query_params:
      - recording:
          sql: "[[detections]].recording_id = {{recording}}"
          multivalue_sql: "[[detections]].recording_id in {{recording}}"
