# Shared tables for every database/version config.
# Each version config selects its schema with `schema: <name>`, so [[detections]]
# resolves to that schema's table. Any route can also reference another model's
# tables directly, e.g. [[owl_5p0.detections]].
database:
  # defaults for every table (a table's own keys override these)
  meta:
    region: us-west-2
    public: true
  schema:
    birdnet_2p4:  # birdnet/2.4
      detections:
        uri: s3://dse-soundhub/artifacts/run-ee2e6559-d00a-4c27-a6ba-7baf97481fc4/detections/49d5c291983581c8efcdee92d7800d7d28c9be8213b45867a118626738450a77.parquet
      revisions:
        uri: s3://dse-soundhub/public/dev/dummy/fake_revisions.bn2p4.parquet
    birdnet_bullfrog_2p4v0p5:  # birdnet/2.4/bullfrog/0.5
      detections:
        uri: s3://dse-soundhub/artifacts/run-29ec22ae-456d-43cc-a437-d0863ddece4a/detections/9531a8b6e3b2c1720267e77dc8117fbb9715d0c8b8f96ee61de386f1383ecf8e.parquet
    birdnet_nutria_2p4v0p5:  # birdnet/2.4/nutria/0.5
      detections:
        uri: s3://dse-soundhub/artifacts/run-0eb5a647-a9c5-47f5-aaf8-81a89bc1f9d6/detections/54eceae61b2989d1b1d7d241cb0da2889b7e32e7f82c4830c567c0ea31ec8cff.parquet
    owl_4p0:  # owl/4.0
      detections:
        uri: s3://dse-soundhub/artifacts/run-e62d060d-a510-48dd-93ef-c848210e857d/detections/f34f69e0886650c7023697f6d39a0890089f8ed4cebea9edab46860c987bab84.parquet
    owl_5p0:  # owl/5.0
      detections:
        uri: s3://dse-soundhub/artifacts/run-96ca354e-3653-4c98-86e0-80cc5b3702eb/detections/d06d60d5a949e31be081da9fa9c91fd2e926f77c79e41e7453f7292815ed879b.parquet
    perch_bullfrog_8p0v0p5:  # perch/8.0/bullfrog/0.5
      detections:
        uri: s3://dse-soundhub/artifacts/run-a2688278-4931-4e99-9d98-7aab2a431af5/detections/05c9b543bf8685dbd15ebc0936e3197febc3ce843435755d635366b157350150.parquet

# Named groups of schemas: [[all_models.detections]] reads all of them, and
# [[all_models!.detections]] skips the current model/version's schema.
schema_groups:
  all_models:
    - birdnet_2p4
    - birdnet_bullfrog_2p4v0p5
    - birdnet_nutria_2p4v0p5
    - owl_4p0
    - owl_5p0
    - perch_bullfrog_8p0v0p5
  bullfrog_models:
    - birdnet_bullfrog_2p4v0p5
    - perch_bullfrog_8p0v0p5

# model/versions are added here although they can also be added explicity through config files
# - ex: api_dock_config/databases/<model>/{0.3|0.4|0.5}.yaml
slugs:
  - name: owl
    versions:
      - version: "4.0"
        description: owl-model dev database - Version 0.1
        schema: owl_4p0
      - version: "5.0"
        description: owl-model dev database - Version 5.0
        schema: owl_5p0
  - name: birdnet
    version: "2.4"
    description: BirdNET v2.4 detection database - Version 0.1
    schema: birdnet_2p4
  # Transfer-learning models are nested under the model/version they build on:
  # /birdnet/2.4/bullfrog/0.5/... (name birdnet/2.4/bullfrog, version 0.5)
  - name: birdnet/2.4/bullfrog
    version: "0.5"
    description: American Bullfrog Classifier from Birdnet 2.4
    schema: birdnet_bullfrog_2p4v0p5
  - name: birdnet/2.4/nutria
    version: "0.5"
    description: Nutria Classifier from Birdnet 2.4
    schema: birdnet_nutria_2p4v0p5
  - name: perch/8.0/bullfrog
    version: "0.5"
    description: American Bullfrog Classifier from Perch 8.0
    schema: perch_bullfrog_8p0v0p5

# Added to every model/version (a model/version's own route with the same shape
# replaces the shared one). `include`/`exclude` limit a route to / skip it for
# listed model/versions: detections/ has a birdnet/2.4-only count with revisions.
routes:
  - route: /recordings/{{recording_id}}/detections/
    sql: SELECT [[detections]].* FROM [[detections]] WHERE [[detections]].recording_id = {{recording_id}}
  - route: /detections/{{id}}
    sql: SELECT [[detections]].* FROM [[detections]] WHERE [[detections]].id = {{id}}
  # Overlaps: every detection, from any model/version (including this one), on the same
  # recording whose [start_time, end_time) overlaps this detection's, except this
  # detection itself (what /detections/{{id}} returns). Other overlapping detections
  # from this model/version (e.g. other ranks in the same window) ARE included.
  # The source row is matched on schema + id: ids like 1_t18660p0_r1 repeat across
  # models, so excluding on id alone would drop other models' detections too.
  # Each row says which model/version it came from (schema_name, name, version).
  - route: /detections/{{id}}/overlaps
    source_columns: [schema, name, version]
    sql: |
      WITH src AS (
        SELECT recording_id, start_time, end_time FROM [[detections]] WHERE id = {{id}}
      )
      SELECT detections.* EXCLUDE (schema_name)
      FROM [[*.detections]] detections
      JOIN src ON detections.recording_id = src.recording_id
              AND detections.start_time < src.end_time
              AND detections.end_time   > src.start_time
      WHERE NOT (detections.schema_name = {{self.schema}} AND detections.id = {{id}})
  # Same route limited to a schema group (see schema_groups above). To use it, comment
  # out the route above and uncomment this one.
  # - route: /detections/{{id}}/overlaps
  #   source_columns: [schema, name, version]
  #   sql: |
  #     WITH src AS (
  #       SELECT recording_id, start_time, end_time FROM [[detections]] WHERE id = {{id}}
  #     )
  #     SELECT detections.*
  #     FROM [[all_models.detections]] detections
  #     JOIN src ON detections.recording_id = src.recording_id
  #             AND detections.start_time < src.end_time
  #             AND detections.end_time   > src.start_time
  #     WHERE NOT (detections.schema_name = {{self.schema}} AND detections.id = {{id}})
  - route: detections/
    exclude: ['birdnet/2.4']
    sql:
      - when: count
        then:
          sql: >
            SELECT detections.common_name, detections.scientific_name,
                   COUNT(*) AS count
            FROM [[detections]]
          sql_append: GROUP BY detections.common_name, detections.scientific_name ORDER BY count DESC
      - else: SELECT [[detections]].* FROM [[detections]]
    query_params:
      - recording:
          sql: "[[detections]].recording_id = {{recording}}"
          multivalue_sql: "[[detections]].recording_id in {{recording}}"
  - route: detections/
    include: ['birdnet/2.4']
    sql:
      - when: count
        then:
          # Revisions are counted per detection before the join, so each detection stays one
          # row and COUNT(*) works. COUNT(DISTINCT id) over the joined rows gives the same
          # numbers but needs ~10x the memory (it OOM-killed the 1 GB App Runner instance).
          sql: >
            SELECT detections.common_name, detections.scientific_name,
                   COUNT(*) AS count,
                   COALESCE(SUM(revisions.revcount), 0) AS revcount
            FROM [[detections]]
            LEFT JOIN (
              SELECT observation_id, COUNT(*) AS revcount FROM [[revisions]] GROUP BY observation_id
            ) revisions ON revisions.observation_id = detections.id
          sql_append: GROUP BY detections.common_name, detections.scientific_name ORDER BY count DESC
      - else: SELECT [[detections]].* FROM [[detections]]
    query_params:
      - recording:
          sql: "[[detections]].recording_id = {{recording}}"
          multivalue_sql: "[[detections]].recording_id in {{recording}}"

# Added to every model/version. A version config's own query param with the
# same name overrides these. WHERE fragments are built before any GROUP BY in a
# route's sql_append, so they also apply to count queries.
query_params:
  - confidence:
      sql: "[[detections]].confidence >= {{confidence}}"
  - scientific_name:
      sql: "UPPER([[detections]].scientific_name) = UPPER('{{scientific_name}}')"
  - common_name:
      sql: "UPPER([[detections]].common_name) = UPPER('{{common_name}}')"
  - rank:
      sql: "[[detections]].rank <= {{rank}}"
  - start_time:
      sql: "[[detections]].start_time >= {{start_time}}"
  - end_time:
      sql: "[[detections]].end_time <= {{end_time}}"
  - sort:
      sql_append: ORDER BY {{sort}} {{direction}}
  - direction:
      default: ASC
  - offset:
      sql_append: OFFSET {{offset}}
  - limit:
      sql_append: LIMIT {{limit}}
